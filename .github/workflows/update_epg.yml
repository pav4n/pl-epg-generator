name: Update Premier League EPG

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run EPG generator
        run: python generate_epg.py

      - name: Commit and push generated XML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pl_epg_games.xml
          if git diff-index --quiet HEAD pl_epg_games.xml; then
            echo "No changes in pl_epg_games.xml to commit."
          else
            git commit -m "Auto-update Premier League EPG"
            git push origin HEAD
          fi
